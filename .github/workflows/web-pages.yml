# Publishes the web version of the game feed to GitHub Pages on every push to main:
#   https://robthewizzuk.github.io/game-scroll/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Pages on a private repo needs a paid plan (GitHub Pro); on the free plan the repo must be public.
# vite.config.js uses a relative base ('./'), so the build works under the /game-scroll/ subpath as is.
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the web app
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
