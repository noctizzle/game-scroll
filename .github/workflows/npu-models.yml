# Uploads the models the phone's AI chip runs (src/kit/npu.js: face and hand tracking, sound recognition)
# from ml-models/<NPU_VERSION>/ (made by scripts/npu-models/convert.py) to
# assets.game-scroll.com/ml/<NPU_VERSION>/, once, after checking them against the SHA-256s the app is
# built with (src/kit/npu-files.js). The app downloads each one the first time a game needs it, and
# only runs a file whose SHA-256 matches.
#
# Needs the CLOUDFLARE_API_TOKEN secret (see games-r2.yml).
name: NPU models (Cloudflare R2)

on:
  push:
    branches: [main]
    paths: ['ml-models/**', 'src/kit/npu-files.js', '.github/workflows/npu-models.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npu-models
  cancel-in-progress: false

env:
  CF_ACCOUNT: 4d04f07305a8d0b2efd5221d16d92e35
  BUCKET: game-scroll
  PUBLIC_URL: https://assets.game-scroll.com

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Already uploaded?
        id: have
        run: |
          v=$(node -e "import('./src/kit/npu-files.js').then(m=>console.log(m.NPU_VERSION))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          missing=0
          for f in $(node -e "import('./src/kit/npu-files.js').then(m=>console.log(Object.keys(m.NPU_FILES).join(' ')))"); do
            curl -fsI "$PUBLIC_URL/ml/$v/$f" >/dev/null 2>&1 || missing=$((missing+1))
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "$missing of the $v model files are not uploaded yet." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check they are the files the app expects
        run: node scripts/npu-models/check.mjs

      - name: Upload
        if: steps.have.outputs.missing != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V: ${{ steps.have.outputs.version }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (see games-r2.yml)."; exit 1; fi
          cd ml-models
          for f in "$V"/*; do
            if curl -fsI "$PUBLIC_URL/ml/$f" >/dev/null 2>&1; then continue; fi
            case "$f" in *.txt) t="text/plain; charset=utf-8";; *) t="application/octet-stream";; esac
            curl -fsS --retry 3 -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$BUCKET/objects/ml/$f" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: $t" -H "Cache-Control: public, max-age=31536000, immutable" \
              --data-binary "@$f" >/dev/null
            echo "Uploaded ml/$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
