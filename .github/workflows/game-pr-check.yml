# Checks pull requests that add or change games: builds every game as a streamed file (fails if a
# file name and its id differ), then plays the changed games in a headless browser (smoke + fold,
# plus sweep for Console games). A second job flags game code that touches the network, storage or
# native features (scripts/game-lint.mjs), and lists changed files outside src/games/ that need a
# careful read. Runs with read-only permissions and no secrets, so it is safe for pull requests from
# forks. See CONTRIBUTING.md.
name: Game PR check

on:
  pull_request:
    paths: ['src/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/**', 'workers/**', 'public/**', 'index.html', 'vite.config.js', '.env*']

permissions:
  contents: read

concurrency:
  group: game-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # a PR that touches every game smoke-tests all of them
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build every game as a streamed file
        run: npm run games

      - name: Kit tests (physics, AI, maths)
        run: npm run kit-test

      - name: Find changed games
        id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          ids=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" -- 'src/games/*.js' | sed -n 's#^src/games/\([a-z0-9-]*\)\.js$#\1#p' | tr '\n' ' ')
          console=$(for id in $ids; do grep -q "era: *'console'" "src/games/$id.js" && echo -n "$id "; done || true)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "console=$console" >> "$GITHUB_OUTPUT"
          echo "Changed games: ${ids:-none}"

      - name: Install Playwright
        if: steps.changed.outputs.ids != ''
        run: npm i --no-save playwright && npx playwright install --with-deps chromium

      - name: Build the app with games inside
        if: steps.changed.outputs.ids != ''
        run: npm run build:bundled

      - name: Smoke test
        if: steps.changed.outputs.ids != ''
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: node scripts/smoke.cjs $IDS

      - name: Fold test
        if: steps.changed.outputs.ids != ''
        env:
          IDS: ${{ steps.changed.outputs.ids }}
        run: node scripts/fold.cjs $IDS

      - name: Sweep test (Console games)
        if: steps.changed.outputs.console != ''
        env:
          IDS: ${{ steps.changed.outputs.console }}
        run: node scripts/sweep.cjs $IDS

  # Flags risky code for review. Fails (red) when a changed game reaches the network, storage,
  # Capacitor or other windows, or hides code; the flagged lines show on the Files tab.
  code-flags:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Flag risky code in changed games
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" -- 'src/games/*.js' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "No game files changed."; exit 0; fi
          node scripts/game-lint.mjs $files

      - name: List changed files outside src/games/
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Game PRs should only add or change files in src/games/ (and maybe docs). Anything else
          # runs inside the app or in CI, so a maintainer must read it line by line.
          other=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '^(src/games/[a-z0-9-]+\.js|docs/.*\.(md|png|jpg|webp))$' || true)
          if [ -z "$other" ]; then echo "Only game files changed."; exit 0; fi
          { echo "### Changed outside src/games/ (review every line)"; echo; echo "$other" | sed 's/^/- `/; s/$/`/'; } >> "$GITHUB_STEP_SUMMARY"
          for f in $other; do echo "::warning file=$f::This pull request changes $f, which is outside src/games/. Shared code and CI files run for every game, so review it line by line."; done
