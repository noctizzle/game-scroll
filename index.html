<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<title>Game Scroll</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">GAME<br><b>SCROLL</b></div>
    <div class="feedpick">
      <button id="feed-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="feed-menu" aria-label="Show games: For you"><span id="feed-label">For you</span></button>
      <ul id="feed-menu" role="listbox" aria-label="Show games" hidden>
        <li role="option" data-f="all" aria-selected="true" tabindex="-1"><b>For you</b><small>A mix of everything</small></li>
        <li role="option" data-f="pocket" aria-selected="false" tabindex="-1"><b>Pocket</b><small>Handheld-style pixel games</small></li>
        <li role="option" data-f="console" aria-selected="false" tabindex="-1"><b>Classic · Console</b><small>Cel-shaded 3D console games</small></li>
        <li role="option" data-f="nextgen" aria-selected="false" tabindex="-1"><b>Next Gen · Console</b><small>Modern HD 3D games</small></li>
        <li role="option" data-f="ar" aria-selected="false" tabindex="-1"><b>AR · 3D</b><small>3D games in your real room</small></li>
        <li role="option" data-f="phone" aria-selected="false" tabindex="-1"><b>Casual</b><small>Quick modern phone games</small></li>
      </ul>
    </div>
    <button class="iconbtn" id="mute" aria-label="Sound and haptics">🔊</button>
  </header>
  <main id="feed" aria-label="Game feed"></main>
  <dialog id="wallet" aria-label="Credits and trophies"></dialog>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
