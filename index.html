<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0e12">
<title>Game Scroll</title>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">GAME<br><b>SCROLL</b></div>
    <label class="feedpick">
      <span class="sr">Show games</span>
      <select id="feed-filter" aria-label="Show games">
        <option value="all" selected>For you</option>
        <option value="pocket">Pocket</option>
        <option value="console">Console</option>
        <option value="phone">Casual</option>
      </select>
    </label>
    <button class="iconbtn" id="mute" aria-label="Toggle sound">🔊</button>
  </header>
  <main id="feed" aria-label="Game feed"></main>
  <dialog id="wallet" aria-label="Credits and trophies"></dialog>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
