<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0e12">
<title>Game Scroll</title>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">GAME<br><b>SCROLL</b></div>
    <nav class="tabs" aria-label="Feed filter">
      <button id="tab-all" data-f="all" aria-pressed="true">For you</button>
      <button id="tab-pocket" data-f="pocket" aria-pressed="false">Pocket</button>
      <button id="tab-phone" data-f="phone" aria-pressed="false">Casual</button>
    </nav>
    <button class="iconbtn" id="mute" aria-label="Toggle sound">🔊</button>
  </header>
  <main id="feed" aria-label="Game feed"></main>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
