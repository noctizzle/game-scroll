// Google Play Games Services v2 bridge for Game Scroll (see GameServicesPlugin.java).
ext {
    // Check https://developers.google.com/games/services/android/release-notes for the newest version.
    playGamesVersion = project.hasProperty('playGamesVersion') ? rootProject.ext.playGamesVersion : '20.1.2'
    playIntegrityVersion = project.hasProperty('playIntegrityVersion') ? rootProject.ext.playIntegrityVersion : '1.4.0'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.gamescroll.gameservices"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // getActivity() returns an AppCompatActivity, so javac needs it on the classpath
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.google.android.gms:play-services-games-v2:$playGamesVersion"
    // Play Integrity: proves to api.game-scroll.com that requests come from the real app (see integrity()).
    implementation "com.google.android.play:integrity:$playIntegrityVersion"
}
