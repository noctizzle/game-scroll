<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// Fixed 3D scenes drawn with the kit (Next Gen with air, grade, glare, shadows, AO, bloom; Classic
// Console toon + ink), for scripts/look-compare.cjs to compare two versions of the engine (or,
// later, WebGPU against WebGL) pixel by pixel. Everything here is seeded: no randomness, no time.
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
// ?gpu: draw on WebGPU (look-compare.cjs --webgpu), to compare with a set saved on WebGL
const GPU = new URLSearchParams(location.search).has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
if (GPU && !await prepareGPU()) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, out = {}, backends = {};
const frame = () => new Promise(r => requestAnimationFrame(r));
window.__hd.force = 3; window.__hd.upscale = false;
async function nextgen(tier, wet = 0) {
  window.__hd.force = tier;
  const v = new gs.hd.HDView({ bg: '#9ab4d0', fog: .002, amb: .3 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 4, 9); v.cam.lookAt(0, 1, 0); v.cam.updateMatrixWorld();
  const sun = gs.hd.sun('#fff2d8', 3, 18, [-.45, 1, .35]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);
  const ground = new T.Mesh(new T.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), gs.hd.pbr('#6a7a58', { rough: .9 })); ground.receiveShadow = true; v.scene.add(ground);
  const cols = ['#c44', '#4a8', '#48c', '#cc4', '#a6c'];
  for (let i = 0; i < 5; i++) { const m = new T.Mesh(gs.hd.rbox(1, 1.6, 1), gs.hd.pbr(cols[i], { rough: .3 + i * .1, metal: i % 2 })); m.position.set(-3 + i * 1.5, .8, -i * .7); m.rotation.y = i * .4; m.castShadow = m.receiveShadow = true; v.scene.add(m); }
  const glow = new T.Mesh(new T.SphereGeometry(.4, 24, 16), gs.hd.pbr('#fff', { glow: 3, glowCol: '#ffb040' })); glow.position.set(1.5, 2.5, 0); v.scene.add(glow);
  v.air({ haze: .002, mist: .004, mistFall: .3, wet }); v.grade = { saturation: 1.1, contrast: 1.05, shadows: '#e8f0ff', highlights: [1.06, 1, .92] }; v.glare = .6;
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend];
}
// a dark room: thick fog, point lights from the lamp pool, metal walls (indoor games)
async function dark(tier) {
  window.__hd.force = tier;
  const Q = new URLSearchParams(location.search), v = new gs.hd.HDView({ bg: '#05060c', fog: .05, env: +(Q.get('env') ?? .45), sky: '#6080c0', ground: '#201018', amb: +(Q.get('amb') ?? .3) }).lampLights(12), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 1.5, 6); v.cam.lookAt(0, 1, -6); v.cam.updateMatrixWorld();
  const wall = gs.hd.pbr('#ffffff', { rough: 1, metal: .45, side: T.BackSide });
  v.scene.add(new T.Mesh(new T.BoxGeometry(6, 4, 40).translate(0, 2, -10), wall));
  for (let i = 0; i < 4; i++) { const m = new T.Mesh(gs.hd.rbox(1, 1, 1), gs.hd.pbr(['#c44', '#4a8', '#48c', '#cc4'][i], { rough: .4, metal: .3 })); m.position.set(i % 2 ? 1.2 : -1.2, .5, -i * 4); v.scene.add(m); }
  const neon = new T.Mesh(new T.BoxGeometry(.1, .1, 30).translate(-2.9, 3.5, -10), gs.hd.pbr('#ff2a8a', { glow: 2.4 })); v.scene.add(neon);
  for (const m of v.scene.children) if (m.isMesh && m.material !== wall) m.castShadow = true;
  v.contact({ y: 0, size: 8 }).at(0, -3);
  // a headlight that casts shadows (racing and shooter games), turned on for the tier like the games do
  const head = gs.hd.spot('#e8f0ff', 60, 30, .45); head.position.set(.3, 1.2, 4); head.target.position.set(0, .3, -8); v.scene.add(head, head.target); head.setTier(gs.hd.TIERS[tier]);
  const post = new T.Mesh(new T.BoxGeometry(.3, 1.4, .3), gs.hd.pbr('#888')); post.position.set(.6, .7, 1); post.castShadow = true; v.scene.add(post);   // soft contact shadows under the boxes
  if (Q.get('bloom')) v.bloom = +Q.get('bloom');
  if (Q.get('lamps') !== '0') v.placeLamps([{ x: 0, y: 3.5, z: 2 }, { x: 0, y: 3.5, z: -6 }, { x: 0, y: 3.5, z: -14 }], 0, 1.5, 6);
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend];
}
// a sonar ring (gs.hd.pulse) sweeping over rock in the dark, with an instanced row of spikes
async function pulseScene() {
  window.__hd.force = 2;
  const v = new gs.hd.HDView({ bg: '#02060a', fog: .04, env: .2, amb: .15 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 2, 7); v.cam.lookAt(0, 0, -3); v.cam.updateMatrixWorld();
  const at = { value: new T.Vector3(0, 0, 2) }, radius = { value: 5 }, strength = { value: 2.2 };
  const rock = gs.hd.pulse(gs.hd.pbr('#5a626c', { rough: 1 }), { at, radius, strength }), spike = gs.hd.pulse(gs.hd.pbr('#3a3e44', { rough: .8 }), { at, radius, strength, color: [1, .5, .2] });
  v.scene.add(new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2).translate(0, -.5, -5), rock));
  const sp = new T.InstancedMesh(new T.ConeGeometry(.3, 1.4, 8), spike, 9), d = new T.Object3D();
  for (let i = 0; i < 9; i++) { d.position.set(-4 + i, .2, -2 - (i % 3)); d.updateMatrix(); sp.setMatrixAt(i, d.matrix); } v.scene.add(sp);
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend];
}
// GPU particles (gs.hd.GPUParticles): bursts with no random spread (so both backends draw the same), under
// gravity, drag, a swirl and a floor, stepped a fixed time; glowing sparks and soft smoke
async function sparksScene() {
  window.__hd.force = 2;
  const v = new gs.hd.HDView({ bg: '#0a0c14', fog: .02, env: .2, amb: .2 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 3, 9); v.cam.lookAt(0, 1.5, 0); v.cam.updateMatrixWorld();
  v.scene.add(new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), gs.hd.pbr('#30343c', { rough: .8 })));
  const fire = new gs.hd.GPUParticles(v, { max: 4000, gravity: 6, drag: .4, floor: 0, turbulence: { strength: 2, scale: .8, speed: 1 } });
  const smoke = new gs.hd.GPUParticles(v, { max: 1000, additive: false, drag: .8 });
  v.render(x, 240, 320); await frame();
  for (let f = 0; f < 24; f++) {
    if (f < 12) for (let k = 0; k < 4; k++) { const a = f * .9 + k * 1.6; fire.emit(20, { at: [Math.cos(a) * .5, 2.5, Math.sin(a) * .5], vel: [Math.cos(a) * 3, 4 + k, Math.sin(a) * 3], spread: 0, life: 1.4, size: [.12, .04], color: [3, 1.6, .5], to: [1.5, .2, .1] }); }
    if (f % 4 === 0) smoke.emit(10, { at: [-2 + f * .15, .5, -1], vel: [.3, 1, 0], spread: 0, life: 3, size: [.4, 1.2], color: '#8890a0', alpha: .5, fadeIn: true });
    fire.update(1 / 30); smoke.update(1 / 30); v.t = 0; v.render(x, 240, 320); await frame();
  }
  return [c.toDataURL(), window.__hd.info.backend];
}
// an outdoor valley (gs.outdoors looks, gs.sky, gs.props): painted ground with fields, a lane and mud,
// far hills, mossy rocks, leaf cards and their impostors, a sky with clouds and its own reflections,
// air with cloud shadows, rain-wet surfaces, a near shadow cascade, sun shafts and depth of field.
// ?feat=-clouds,-wet,-shafts,-focus,-casc,-env,-props,-sky,-air,-land turns pieces off (to find a difference).
async function outdoor(tier, phys = false) {
  window.__hd.force = tier;
  const F = new Set((new URLSearchParams(location.search).get('feat') || '').split(',')), on = k => !F.has('-' + k);
  const { Land, looks, groundDetail, horizon, impostor, Wind } = gs.outdoors, { Sky } = gs.sky, { Props } = gs.props;
  const v = new gs.hd.HDView({ bg: '#9ab4d0', fog: .002, amb: .35 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.far = 900; v.cam.updateProjectionMatrix();
  v.cam.position.set(0, 7, 26); v.cam.lookAt(-8, 1, -20); v.cam.updateMatrixWorld();
  const sun = gs.hd.sun('#fff0d8', 3, 30, [-.6, .45, -.9]); v.scene.add(sun, sun.target); v.sun = sun;
  const land = new Land({ kind: (x, z) => Math.sin(x * .04) * 3 + Math.cos(z * .05) * 2 + Math.max(0, -z - 40) * .2, size: 200, segments: 80 });
  land.masks((x, z, y, sl) => [x < -10 ? 1 : 0, x > 30 ? 1 : 0, sl > .25 ? 1 : 0, Math.abs(z + 5) < 6 ? .8 : 0]);
  const det = groundDetail({ seed: 3 });
  const gl = looks.ground(land.mesh.material, { detail: det.detail, roads: [[-60, 10, 0, 0], [0, 0, 50, -40]], wet: on('wet') ? .4 : 0, bank: { low: -2.6, high: -1.6 } });
  if (on('land')) v.scene.add(land.object);
  const hz = horizon(land, { seed: 4 }); v.scene.add(hz);
  const rockM = gs.hd.pbr('#8a857a', { rough: .9 }); looks.rock(rockM, { detail: det.detail });
  for (let i = 0; i < 4; i++) { const r = new T.Mesh(new T.DodecahedronGeometry(1.2 + i * .3, 1), rockM); r.position.set(-12 + i * 5, land.height(-12 + i * 5, 6) + .4, 6 - i * 2); r.castShadow = r.receiveShadow = true; v.scene.add(r); }
  // leaf cards: a seeded blobby picture with cut-out edges, crossed planes on a trunk
  const lc = document.createElement('canvas'); lc.width = 128; lc.height = 128; const lx = lc.getContext('2d'), R = gs.math.rng(5);
  for (let i = 0; i < 140; i++) { lx.fillStyle = `hsl(${95 + R() * 30},${40 + R() * 20}%,${22 + R() * 18}%)`; lx.beginPath(); lx.arc(16 + R() * 96, 16 + R() * 96, 4 + R() * 7, 0, 7); lx.fill(); }
  const lt = new T.CanvasTexture(lc); lt.colorSpace = T.SRGBColorSpace;
  const leafM = new T.MeshStandardMaterial({ map: lt, alphaTest: .5, side: T.DoubleSide, roughness: .8 });
  const wind = new Wind({ x: 3, z: 1 }); wind.update(0);
  looks.leaves(leafM, { time: 1.3, wind, sun: new T.Vector3(-.6, .45, -.9).normalize(), atlas: [128, 128] });
  const tg = []; for (let k = 0; k < 3; k++) tg.push(new T.PlaneGeometry(4, 4).rotateY(k * Math.PI / 3).translate(0, 4, 0));
  const trunk = new T.CylinderGeometry(.15, .25, 2.5, 6).translate(0, 1.25, 0);
  const crown = (await import('three/examples/jsm/utils/BufferGeometryUtils.js')).mergeGeometries(tg);
  for (let i = 0; i < 5; i++) { const px = 8 + i * 4, pz = -4 - i * 3, y = land.height(px, pz); const t = new T.Mesh(trunk, gs.hd.pbr('#5a4030', { rough: 1 })); t.position.set(px, y, pz); const l = new T.Mesh(crown, leafM); l.position.set(px, y, pz); l.castShadow = t.castShadow = true; v.scene.add(t, l); }
  if (on('props')) {
    const imp = impostor(crown, leafM, { cards: 3, size: 64 }); if (imp) looks.leaves(imp.material, { time: 1.3, wind, atlas: [192, 64] });
    const props = new Props(v.scene); props.kind('tree', crown, leafM, { lod: imp ? [[30, imp.geometry, imp.material]] : [] });
    for (let i = 0; i < 24; i++) { const px = -70 + (i % 8) * 9, pz = -30 - Math.floor(i / 8) * 12; props.add('tree', px, land.height(px, pz), pz, { rot: i, scale: 1 + (i % 3) * .2 }); }
    props.done();
  }
  if (on('sky')) { const sky = new Sky(v, { time: 16.5, stars: 0, sun, clouds: .45, gap: .3, env: on('env'), fog: false, physical: phys }); sky.update(0); }
  if (on('air')) v.air({ haze: .0015, mist: .004, mistFall: .25, clouds: on('clouds') ? .5 : 0, cloudShade: .5, wet: on('wet') ? .4 : 0 });
  v.grade = { saturation: 1.05, contrast: 1.04 }; v.glare = .4;
  if (on('shafts')) v.shafts = .9;
  if (on('focus')) v.focus = { at: 20, range: 4, depth: .4, blur: 6 };
  sun.fit(v, { far: 200, near: on('casc') ? 25 : 0, ground: (x, z) => land.height(x, z) });
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend + (window.__hd.info.webgl ? ' (' + window.__hd.info.webgl + ')' : '')];
}
function consoleScene() {
  const { View, part, G } = gs.toon, v = new View(), c = document.createElement('canvas'); c.width = 192; c.height = 160; const x = c.getContext('2d');
  v.board(192, 160, .9);
  for (let i = 0; i < 4; i++) { const m = part(new T.BoxGeometry(24, 24, 24), ['#e44', '#4c4', '#46e', '#ec4'][i], { x: -60 + i * 40, y: 12, ry: i * .5 }); v.scene.add(m); }
  v.scene.add(part(new T.SphereGeometry(16, 20, 14), '#fa6', { y: 16, z: 30 }));
  v.render(x, 192, 160);
  return c.toDataURL();
}
try {
  const only = new URLSearchParams(location.search).get('only');
  for (const t of only ? [+only] : [0, 1, 2, 3]) [out['nextgen-tier' + t], backends['nextgen-tier' + t]] = await nextgen(t);
  [out['nextgen-wet'], backends['nextgen-wet']] = await nextgen(3, .3);
  for (const t of [0, 3]) [out['dark-tier' + t], backends['dark-tier' + t]] = await dark(t);   // rain on the air: WebGL only so far
  [out.pulse, backends.pulse] = await pulseScene();
  [out.sparks, backends.sparks] = await sparksScene();
  for (const t of [1, 3]) [out['outdoor-tier' + t], backends['outdoor-tier' + t]] = await outdoor(t);
  [out['outdoor-physical'], backends['outdoor-physical']] = await outdoor(3, true);
  out.console = consoleScene();
} catch (e) { out.error = String(e && e.stack || e); }
window.__hd.force = null;
out.backends = backends;
window.result = out;
</script>
