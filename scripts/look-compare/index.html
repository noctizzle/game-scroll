import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';

const GPU = new URLSearchParams(location.search).has('gpu');

await loadParts();

const frame = () => new Promise(r => requestAnimationFrame(r));
window.__hd.force = 3; window.__hd.upscale = false;

  v.cam.position.set(0, 4, 9); v.cam.lookAt(0, 1, 0); v.cam.updateMatrixWorld();
  const sun = gs.hd.sun('#fff2d8', 3, 18, [-.45, 1, .35]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);

// a dark room: thick fog, point lights from the lamp pool, metal walls (indoor games)

  for (let i = 0; i < 4; i++) { const m = new T.Mesh(gs.hd.rbox(1, 1, 1), gs.hd.pbr(['#c44', '#4a8', '#48c', '#cc4'][i], { rough: .4, metal: .3 })); m.position.set(i % 2 ? 1.2 : -1.2, .5, -i * 4); v.scene.add(m); }

  const head = gs.hd.spot('#e8f0ff', 60, 30, .45); head.position.set(.3, 1.2, 4); head.target.position.set(0, .3, -8); v.scene.add(head, head.target); head.setTier(gs.hd.TIERS[tier]);

// a sonar ring (gs.hd.pulse) sweeping over rock in the dark, with an instanced row of spikes
async function pulseScene() {
  window.__hd.force = 2;
  const v = new gs.hd.HDView({ bg: '#02060a', fog: .04, env: .2, amb: .15 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');

  v.scene.add(new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2).translate(0, -.5, -5), rock));
  const sp = new T.InstancedMesh(new T.ConeGeometry(.3, 1.4, 8), spike, 9), d = new T.Object3D();
  for (let i = 0; i < 9; i++) { d.position.set(-4 + i, .2, -2 - (i % 3)); d.updateMatrix(); sp.setMatrixAt(i, d.matrix); } v.scene.add(sp);
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }

// GPU particles (gs.hd.GPUParticles): bursts with no random spread (so both backends draw the same), under
// gravity, drag, a swirl and a floor, stepped a fixed time; glowing sparks and soft smoke
async function sparksScene() {
  window.__hd.force = 2;
  const v = new gs.hd.HDView({ bg: '#0a0c14', fog: .02, env: .2, amb: .2 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 3, 9); v.cam.lookAt(0, 1.5, 0); v.cam.updateMatrixWorld();
  v.scene.add(new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), gs.hd.pbr('#30343c', { rough: .8 })));
  const fire = new gs.hd.GPUParticles(v, { max: 4000, gravity: 6, drag: .4, floor: 0, turbulence: { strength: 2, scale: .8, speed: 1 } });
  const smoke = new gs.hd.GPUParticles(v, { max: 1000, additive: false, drag: .8 });
  v.render(x, 240, 320); await frame();
  for (let f = 0; f < 24; f++) {
    if (f < 12) for (let k = 0; k < 4; k++) { const a = f * .9 + k * 1.6; fire.emit(20, { at: [Math.cos(a) * .5, 2.5, Math.sin(a) * .5], vel: [Math.cos(a) * 3, 4 + k, Math.sin(a) * 3], spread: 0, life: 1.4, size: [.12, .04], color: [3, 1.6, .5], to: [1.5, .2, .1] }); }
    if (f % 4 === 0) smoke.emit(10, { at: [-2 + f * .15, .5, -1], vel: [.3, 1, 0], spread: 0, life: 3, size: [.4, 1.2], color: '#8890a0', alpha: .5, fadeIn: true });
    fire.update(1 / 30); smoke.update(1 / 30); v.t = 0; v.render(x, 240, 320); await frame();
  }
  return [c.toDataURL(), window.__hd.info.backend];
}
// skinned people (gs.poses.person): one walking to a run on a blend space, one with a foot on a step

  const step = new T.Mesh(new T.BoxGeometry(.3, .25, .8).translate(0, .125, 0), gs.hd.pbr('#998877', { rough: .8 })); step.position.set(1.33, 0, -.2); step.castShadow = step.receiveShadow = true; v.scene.add(step);

    b.rig.play('idle'); b.rig.update(1 / 30); b.updateMatrixWorld(true); b.rig.plant((px, pz) => Math.abs(px - 1.33) < .15 && Math.abs(pz + .2) < .4 ? .25 : 0, b);

// a room lit through a window: bounce light (v.bounce) off a red wall and a sunlit floor, and a polished

async function roomScene() {

  const v = new gs.hd.HDView({ bg: '#c8dcf0', fog: 0, env: .15, amb: .05 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');

  const W = (w, h, d, col, px, py, pz, o = {}) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), gs.hd.pbr(col, o)); m.position.set(px, py, pz); m.castShadow = m.receiveShadow = true; v.scene.add(m); return m; };

  W(.1, 3, 8, '#c0392b', -3, 1.5, 0, { rough: .9 });              // red wall
  W(6, 3, .1, '#e8e4dc', 0, 1.5, -4, { rough: .9 });              // back wall
  W(.1, 3, 3.5, '#e8e4dc', 3, 1.5, -2.25, { rough: .9 }); W(.1, 3, 3, '#e8e4dc', 3, 1.5, 2.5, { rough: .9 }); W(.1, .9, 1.5, '#e8e4dc', 3, 2.55, .25, { rough: .9 });   // right wall with a window

// a dark barn: the sun through gaps in a slatted wall and a spot lamp, seen in dusty air (v.beams), then

async function beamsScene() {

  const W = (w, h, d, col, px, py, pz) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), gs.hd.pbr(col, { rough: .9 })); m.position.set(px, py, pz); m.castShadow = m.receiveShadow = true; v.scene.add(m); return m; };

  for (let i = 0; i < 9; i++) W(.1, 3, .55, '#5a4836', 4, 1.5, -3.6 + i * .9);   // slats with gaps

// a river over a waterfall round a rock, beside a lava stream (gs.flow + gs.outdoors River: the flow and lava looks)
async function riverScene() {
  window.__hd.force = 2;
  const { River } = gs.outdoors, { Streams } = gs.flow, { Path } = gs.paths;
  const v = new gs.hd.HDView({ bg: '#8aa4c0', fog: .004, amb: .35 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');

  const rockM = gs.hd.pbr('#6a6458', { rough: .95 });

  B(40, 4, 14, 0, 2, -13); B(40, 1, 26, 0, -.5, 7);   // a cliff and the ground below

  const rk = new T.Mesh(new T.DodecahedronGeometry(.55, 0), rockM); const rp = river.surface(16, .6); rk.position.set(rp.x, rp.y + .1, rp.z); rk.castShadow = true; v.scene.add(rk);

// an outdoor valley (gs.outdoors looks, gs.sky, gs.props): painted ground with fields, a lane and mud,
// far hills, mossy rocks, leaf cards and their impostors, a sky with clouds and its own reflections,
// air with cloud shadows, rain-wet surfaces, a near shadow cascade, sun shafts and depth of field.
// ?feat=-clouds,-wet,-shafts,-focus,-casc,-env,-props,-sky,-air,-land turns pieces off (to find a difference).
async function outdoor(tier, phys = false) {
  window.__hd.force = tier;
  const F = new Set((new URLSearchParams(location.search).get('feat') || '').split(',')), on = k => !F.has('-' + k);
  const { Land, looks, groundDetail, horizon, impostor, Wind } = gs.outdoors, { Sky } = gs.sky, { Props } = gs.props;
  const v = new gs.hd.HDView({ bg: '#9ab4d0', fog: .002, amb: .35 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');

  const rockM = gs.hd.pbr('#8a857a', { rough: .9 }); looks.rock(rockM, { detail: det.detail });
  for (let i = 0; i < 4; i++) { const r = new T.Mesh(new T.DodecahedronGeometry(1.2 + i * .3, 1), rockM); r.position.set(-12 + i * 5, land.height(-12 + i * 5, 6) + .4, 6 - i * 2); r.castShadow = r.receiveShadow = true; v.scene.add(r); }
  // leaf cards: a seeded blobby picture with cut-out edges, crossed planes on a trunk
  const lc = document.createElement('canvas'); lc.width = 128; lc.height = 128; const lx = lc.getContext('2d'), R = gs.math.rng(5);
  for (let i = 0; i < 140; i++) { lx.fillStyle = `hsl(${95 + R() * 30},${40 + R() * 20}%,${22 + R() * 18}%)`; lx.beginPath(); lx.arc(16 + R() * 96, 16 + R() * 96, 4 + R() * 7, 0, 7); lx.fill(); }
  const lt = new T.CanvasTexture(lc); lt.colorSpace = T.SRGBColorSpace;

  const wind = new Wind({ x: 3, z: 1 }); wind.update(0);
  looks.leaves(leafM, { time: 1.3, wind, sun: new T.Vector3(-.6, .45, -.9).normalize(), atlas: [128, 128] });
  const tg = []; for (let k = 0; k < 3; k++) tg.push(new T.PlaneGeometry(4, 4).rotateY(k * Math.PI / 3).translate(0, 4, 0));
  const trunk = new T.CylinderGeometry(.15, .25, 2.5, 6).translate(0, 1.25, 0);
  const crown = (await import('three/examples/jsm/utils/BufferGeometryUtils.js')).mergeGeometries(tg);
  for (let i = 0; i < 5; i++) { const px = 8 + i * 4, pz = -4 - i * 3, y = land.height(px, pz); const t = new T.Mesh(trunk, gs.hd.pbr('#5a4030', { rough: 1 })); t.position.set(px, y, pz); const l = new T.Mesh(crown, leafM); l.position.set(px, y, pz); l.castShadow = t.castShadow = true; v.scene.add(t, l); }
  if (on('props')) {
    const imp = impostor(crown, leafM, { cards: 3, size: 64 }); if (imp) looks.leaves(imp.material, { time: 1.3, wind, atlas: [192, 64] });
    const props = new Props(v.scene); props.kind('tree', crown, leafM, { lod: imp ? [[30, imp.geometry, imp.material]] : [] });
    for (let i = 0; i < 24; i++) { const px = -70 + (i % 8) * 9, pz = -30 - Math.floor(i / 8) * 12; props.add('tree', px, land.height(px, pz), pz, { rot: i, scale: 1 + (i % 3) * .2 }); }
