<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// Fixed 3D scenes drawn with the kit (Next Gen with air, grade, glare, shadows, AO, bloom; Classic
// Console toon + ink), for scripts/look-compare.cjs to compare two versions of the engine (or,
// later, WebGPU against WebGL) pixel by pixel. Everything here is seeded: no randomness, no time.
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU, setHdr } from '../../src/kit/gpu.js';
// ?hdr: WebGPU's HDR output on (a half-float, extended-range canvas), as on an HDR phone screen
if (new URLSearchParams(location.search).has('hdr')) setHdr(true);
// ?gpu: draw on WebGPU (look-compare.cjs --webgpu), to compare with a set saved on WebGL
const GPU = new URLSearchParams(location.search).has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
if (GPU && !await prepareGPU()) { window.result = { error: 'WebGPU did not start in this browser' }; throw new Error(window.result.error); }
const T = gs.THREE, out = {}, backends = {};
// ?dbg: every 3 s, what the renderer holds and has drawn (look-compare.cjs prints it with ALLWARN=1)
if (new URLSearchParams(location.search).has('dbg')) { const g = GPU ? await prepareGPU() : null; setInterval(() => { const r = g?.r, i = r?.info; const dev = r?.backend?.device; if (dev) { let ok = false; dev.queue.onSubmittedWorkDone().then(() => { ok = true; }); setTimeout(() => { if (!ok) console.warn('DBG queue stuck 2.5 s'); }, 2500); } console.warn('DBG', JSON.stringify({ hdr: window.__hd.info.hdr, packed: window.__hd.packed,  tex: i?.memory?.textures, geo: i?.memory?.geometries, frame: i?.render?.frame, calls: i?.render?.calls, held: window.__hd.info.held, still: window.__hd.info.still, be: window.__hd.info.backend })); }, 3000); }
const frame = () => new Promise(r => requestAnimationFrame(r));
// every scene's view, freed when the next one starts: a long run would otherwise keep every scene's
// meshes and pictures on the graphics chip (SwiftShader's WebGPU stopped drawing after about 30 scenes)
const views = [];
class HV extends gs.hd.HDView { constructor(o) { free(); super(o); views.push(this); } }
function free() { if (new URLSearchParams(location.search).has('nofree')) return;
  for (const v of views.splice(0)) v.scene.traverse(o => {
    o.geometry?.dispose?.();
    for (const m of [].concat(o.material || [])) { for (const k in m) if (m[k]?.isTexture) m[k].dispose(); m.dispose(); }
  });
}
window.__hd.force = 3; window.__hd.upscale = false; if (new URLSearchParams(location.search).has('nonear')) window.__hd.closeUp = false; if (new URLSearchParams(location.search).has('nopack')) window.__hd.pack = false;
async function nextgen(tier, wet = 0, look = null) {
  window.__hd.force = tier;
  const v = new HV({ bg: '#9ab4d0', fog: .002, amb: .3 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 4, 9); v.cam.lookAt(0, 1, 0); v.cam.updateMatrixWorld();
  const sun = gs.hd.sun('#fff2d8', 3, 18, [-.45, 1, .35]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);
  const ground = new T.Mesh(new T.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), gs.hd.pbr('#6a7a58', { rough: .9 })); ground.receiveShadow = true; v.scene.add(ground);
  const cols = ['#c44', '#4a8', '#48c', '#cc4', '#a6c'];
  for (let i = 0; i < 5; i++) { const m = new T.Mesh(gs.hd.rbox(1, 1.6, 1), gs.hd.pbr(cols[i], { rough: .3 + i * .1, metal: i % 2 })); m.position.set(-3 + i * 1.5, .8, -i * .7); m.rotation.y = i * .4; m.castShadow = m.receiveShadow = true; v.scene.add(m); }
  const glow = new T.Mesh(new T.SphereGeometry(.4, 24, 16), gs.hd.pbr('#fff', { glow: 3, glowCol: '#ffb040' })); glow.position.set(1.5, 2.5, 0); v.scene.add(glow);
  v.air({ haze: .002, mist: .004, mistFall: .3, wet }); v.grade = { saturation: 1.1, contrast: 1.05, shadows: '#e8f0ff', highlights: [1.06, 1, .92] }; v.glare = .6; if (look) v.lut = look;
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend];
}
// a dark room: thick fog, point lights from the lamp pool, metal walls (indoor games)
async function dark(tier) {
  window.__hd.force = tier;
  const Q = new URLSearchParams(location.search), v = new HV({ bg: '#05060c', fog: .05, env: +(Q.get('env') ?? .45), sky: '#6080c0', ground: '#201018', amb: +(Q.get('amb') ?? .3) }).lampLights(12), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 1.5, 6); v.cam.lookAt(0, 1, -6); v.cam.updateMatrixWorld();
  const wall = gs.hd.pbr('#ffffff', { rough: 1, metal: .45, side: T.BackSide });
  v.scene.add(new T.Mesh(new T.BoxGeometry(6, 4, 40).translate(0, 2, -10), wall));
  for (let i = 0; i < 4; i++) { const m = new T.Mesh(gs.hd.rbox(1, 1, 1), gs.hd.pbr(['#c44', '#4a8', '#48c', '#cc4'][i], { rough: .4, metal: .3 })); m.position.set(i % 2 ? 1.2 : -1.2, .5, -i * 4); v.scene.add(m); }
  const neon = new T.Mesh(new T.BoxGeometry(.1, .1, 30).translate(-2.9, 3.5, -10), gs.hd.pbr('#ff2a8a', { glow: 2.4 })); v.scene.add(neon);
  for (const m of v.scene.children) if (m.isMesh && m.material !== wall) m.castShadow = true;
  v.contact({ y: 0, size: 8 }).at(0, -3);
  // a headlight that casts shadows (racing and shooter games), turned on for the tier like the games do
  const head = gs.hd.spot('#e8f0ff', 60, 30, .45); head.position.set(.3, 1.2, 4); head.target.position.set(0, .3, -8); v.scene.add(head, head.target); head.setTier(gs.hd.TIERS[tier]);
  const post = new T.Mesh(new T.BoxGeometry(.3, 1.4, .3), gs.hd.pbr('#888')); post.position.set(.6, .7, 1); post.castShadow = true; v.scene.add(post);   // soft contact shadows under the boxes
  if (Q.get('bloom')) v.bloom = +Q.get('bloom');
  if (Q.get('lamps') !== '0') v.placeLamps([{ x: 0, y: 3.5, z: 2 }, { x: 0, y: 3.5, z: -6 }, { x: 0, y: 3.5, z: -14 }], 0, 1.5, 6);
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend];
}
// a sonar ring (gs.hd.pulse) sweeping over rock in the dark, with an instanced row of spikes
async function pulseScene() {
  window.__hd.force = 2;
  const v = new HV({ bg: '#02060a', fog: .04, env: .2, amb: .15 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 2, 7); v.cam.lookAt(0, 0, -3); v.cam.updateMatrixWorld();
  const at = { value: new T.Vector3(0, 0, 2) }, radius = { value: 5 }, strength = { value: 2.2 };
  const rock = gs.hd.pulse(gs.hd.pbr('#5a626c', { rough: 1 }), { at, radius, strength }), spike = gs.hd.pulse(gs.hd.pbr('#3a3e44', { rough: .8 }), { at, radius, strength, color: [1, .5, .2] });
  v.scene.add(new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2).translate(0, -.5, -5), rock));
  const sp = new T.InstancedMesh(new T.ConeGeometry(.3, 1.4, 8), spike, 9), d = new T.Object3D();
  for (let i = 0; i < 9; i++) { d.position.set(-4 + i, .2, -2 - (i % 3)); d.updateMatrix(); sp.setMatrixAt(i, d.matrix); } v.scene.add(sp);
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend];
}
// GPU particles (gs.hd.GPUParticles): bursts with no random spread (so both backends draw the same), under
// gravity, drag, a swirl and a floor, stepped a fixed time; glowing sparks and soft smoke
async function sparksScene() {
  window.__hd.force = 2;
  const v = new HV({ bg: '#0a0c14', fog: .02, env: .2, amb: .2 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 3, 9); v.cam.lookAt(0, 1.5, 0); v.cam.updateMatrixWorld();
  v.scene.add(new T.Mesh(new T.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), gs.hd.pbr('#30343c', { rough: .8 })));
  const fire = new gs.hd.GPUParticles(v, { max: 4000, gravity: 6, drag: .4, floor: 0, turbulence: { strength: 2, scale: .8, speed: 1 } });
  const smoke = new gs.hd.GPUParticles(v, { max: 1000, additive: false, drag: .8 });
  v.render(x, 240, 320); await frame();
  for (let f = 0; f < 24; f++) {
    if (f < 12) for (let k = 0; k < 4; k++) { const a = f * .9 + k * 1.6; fire.emit(20, { at: [Math.cos(a) * .5, 2.5, Math.sin(a) * .5], vel: [Math.cos(a) * 3, 4 + k, Math.sin(a) * 3], spread: 0, life: 1.4, size: [.12, .04], color: [3, 1.6, .5], to: [1.5, .2, .1] }); }
    if (f % 4 === 0) smoke.emit(10, { at: [-2 + f * .15, .5, -1], vel: [.3, 1, 0], spread: 0, life: 3, size: [.4, 1.2], color: '#8890a0', alpha: .5, fadeIn: true });
    fire.update(1 / 30); smoke.update(1 / 30); v.t = 0; v.render(x, 240, 320); await frame();
  }
  return [c.toDataURL(), window.__hd.info.backend];
}
// skinned people (gs.poses.person): one walking to a run on a blend space, one with a foot on a step
// (foot IK), one up close smiling with the mouth open (blend shapes)
async function peopleScene() {
  window.__hd.force = 2;
  const v = new HV({ bg: '#9ab4d0', fog: .004, amb: .35 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 1.6, 4.2); v.cam.lookAt(0, 1.1, 0); v.cam.updateMatrixWorld();
  const sun = gs.hd.sun('#fff2d8', 3, 8, [-.45, 1, .55]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);
  const ground = new T.Mesh(new T.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), gs.hd.pbr('#6a7a58', { rough: .9 })); ground.receiveShadow = true; v.scene.add(ground);
  const step = new T.Mesh(new T.BoxGeometry(.3, .25, .8).translate(0, .125, 0), gs.hd.pbr('#998877', { rough: .8 })); step.position.set(1.33, 0, -.2); step.castShadow = step.receiveShadow = true; v.scene.add(step);
  const { person } = gs.poses, mat = cl => gs.hd.pbr(cl, { rough: .65 });
  const a = person({ body: '#c0392b', skin: '#e0ac69', hair: '#2b1a10', mat }), b = person({ body: '#2e7d5b', skin: '#8d5524', hair: '#111', sleeves: 'short', mat }), f = person({ body: '#3a6ea5', skin: '#f1c27d', hair: '#7a4a1a', girth: 1.15, mat });
  a.position.set(-1.1, 0, 0); a.rotation.y = .6; b.position.set(1.1, 0, -.2); b.rotation.y = -.5; f.position.set(0, 0, .9);
  v.scene.add(a, b, f);

    a.rig.blend({ idle: 0, walk: 1.4, run: 4 }, 3); a.rig.update(1 / 30, { speed: 3 });
    b.rig.play('idle'); b.rig.update(1 / 30); b.updateMatrixWorld(true); b.rig.plant((px, pz) => Math.abs(px - 1.33) < .15 && Math.abs(pz + .2) < .4 ? .25 : 0, b);
    f.rig.play('wave'); f.rig.update(1 / 30); f.face.blinkEvery = 0; f.face.set('smile', 1).mouth(.6); f.face.update(1 / 30);
  }
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend];
}
// a room lit through a window: bounce light (v.bounce) off a red wall and a sunlit floor, and a polished
// floor and chrome ball with box-projected room reflections (v.room); ?feat=-gi,-room turns them off
// a dark studio lit by two area lights (gs.hd.panel): a softbox above and a striplight behind
async function areaScene() {
  window.__hd.force = 2;
  const v = new HV({ bg: '#101014', fog: 0, env: .05, amb: .02 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 1.6, 3.6); v.cam.lookAt(0, .6, -1); v.cam.updateMatrixWorld();

  W(8, .1, 8, '#6a6a70', 0, -.05, 0, { rough: .25 }); W(8, 4, .1, '#505058', 0, 2, -3, { rough: .7 });
  const ball = new T.Mesh(new T.SphereGeometry(.45, 32, 20), gs.hd.pbr('#ffffff', { rough: .2, metal: 1 })); ball.position.set(-.6, .45, -.8); v.scene.add(ball);
  W(.7, .7, .7, '#d55a3a', .8, .35, -1, { rough: .4 });
  const a = gs.hd.panel('#fff0dc', 10, 2, 1, { glow: true }); a.position.set(0, 2.6, 0); a.lookAt(0, 0, -.5); v.scene.add(a);
  const b = gs.hd.panel('#7ab8ff', 14, 3, .15, { glow: true }); b.position.set(0, .8, -2.9); b.lookAt(0, .8, 1); v.scene.add(b);
  for (let i = 0; i < 40 && !a.visible; i++) await frame();   // the area light tables load on first use
  for (let i = 0; i < 3; i++) { v.t = 0; v.render(x, 240, 320); await frame(); }
  v.t = 0; v.render(x, 240, 320);
  return [c.toDataURL(), window.__hd.info.backend];
}

  v.cam.position.set(0, 1.2, 3.4); v.cam.lookAt(0, .6, 0); v.cam.updateMatrixWorld();

// order-independent transparency (v.oit, WebGPU): coloured glass panes passing through each other
async function oitScene() {
  window.__hd.force = 2;
  const v = new HV({ bg: '#d8dce4', fog: 0, env: .3, amb: .3 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');
  v.cam.position.set(0, 1.2, 3); v.cam.lookAt(0, .8, 0); v.cam.updateMatrixWorld(); v.oit = !new URLSearchParams(location.search).has('nooit');
  const sun = gs.hd.sun('#fff2d8', 3, 6, [-.4, 1, .5]); v.scene.add(sun, sun.target); v.sun = sun; sun.follow(0, 0, 0);
  const floor = new T.Mesh(new T.PlaneGeometry(10, 10).rotateX(-Math.PI / 2), gs.hd.pbr('#8a8a90', { rough: .8 })); v.scene.add(floor);
  ['#ff3030', '#30d040', '#3060ff'].forEach((col, i) => { const m = new T.Mesh(new T.PlaneGeometry(1.4, 1.2), gs.hd.pbr(col, { rough: .2, transparent: true, opacity: .5, side: 2, depthWrite: false })); m.position.set((i - 1) * .35, .8, 0); m.rotation.y = (i - 1) * .9; v.scene.add(m); });

// parallax occlusion mapping (pbr { tex, depth }, WebGPU): a cobbled floor and a brick wall seen at a slant

  const v = new HV({ bg: '#9ab4d0', fog: 0, env: .3, amb: .3 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; const x = c.getContext('2d');

// per-object motion blur (WebGPU): a still camera, a wheel spinning and a ball flying past blur; the post stays sharp
async function objBlurScene() {
  window.__hd.force = 3;
