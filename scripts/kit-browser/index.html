<!doctype html><meta charset="utf-8"><title>kit browser test</title>
<canvas id="c" width="320" height="240"></canvas>
<script type="module">
import gs from '/src/gamescroll.js';
const out = []; const ok = (c, m) => out.push((c ? 'ok   ' : 'FAIL ') + m);
const c = document.getElementById('c').getContext('2d');
try {
  // pixel
  const w = gs.pixel.text(c, 'HELLO 123', 4, 4, { size: 2, color: '#fff', outline: '#000' }); ok(w > 50, 'pixel text width ' + w);
  await document.fonts.load("8px 'Press Start 2P'");
  gs.pixel.text(c, 'BIG', 4, 30, { font: 'big', size: 2 }); ok(true, 'big text');
  const s = gs.pixel.sprite(`.kk.\nkyyk\n.kk.`, { k: '#000', y: '#fd0' }); s.draw(c, 50, 50, { scale: 4, outline: '#fff', flip: true }); ok(s.w === 4 && s.solid(1, 1) && !s.solid(0, 0), 'sprite');
  const a = gs.pixel.anim(['kk', 'yy'], { k: '#000', y: '#ff0' }, 4); a.draw(c, 0, 100, .3); ok(a.frames.length === 2, 'anim');
  // effects
  const feel = new gs.effects.Feel(); feel.coin(10, 10); feel.boom(50, 50); feel.hit(20, 20); feel.combo(5, 30, 30); feel.update(.016); feel.begin(c); feel.end(c, 320, 240); ok(true, 'feel');
  // sound
  gs.sound.zzfx(...[, , 925, .04, .3, .6, 1, .3, , 6.27, -184, .09, .17]); gs.sound.sounds.coin(); ok(true, 'zzfx');
  // gs's 3D and AI parts load on first use: reading one before it's in throws StillLoading
  let g3; try { gs.hd; } catch (x) { g3 = x; } ok(g3?.kitLoading && /gs\.hd/.test(g3.message), 'gs.hd StillLoading before the 3D parts load'); await g3.kitLoading;
  let gai; try { gs.ai; } catch (x) { gai = x; } ok(gai?.kitLoading, 'gs.ai StillLoading'); await gai.kitLoading; ok(!!gs.hd.HDView && !!gs.ai.Crowd && !!gs.THREE.Scene, '3D and AI parts in');
  // comfort settings: shake and flash shrink with Reduce motion (the default here is off)
  ok(gs.prefs.reduceMotion === false && gs.prefs.motion === 1, 'prefs defaults');
  try { gs.prefs.motion = 0; } catch (_) { /* frozen */ } ok(gs.prefs.motion === 1, 'games cannot change prefs');
  // lazy: physics
  let e; try { new gs.physics.Physics(); } catch (x) { e = x; } ok(e && e.kitLoading, 'physics StillLoading'); await e.kitLoading;
  const p = new gs.physics.Physics({ walls: [0, 0, 320, 240] }); const b = p.box(100, 20, 20, 20); for (let i = 0; i < 90; i++) p.step(1 / 60); ok(b.y > 200, 'physics in browser ' + b.y);
  try { new gs.physics3d.World3D(); } catch (x) { e = x; } await e.kitLoading; const w3 = new gs.physics3d.World3D(); w3.floor(0); const bb = w3.ball(null, .5, { at: { x: 0, y: 3, z: 0 } }); for (let i = 0; i < 90; i++) w3.step(1 / 60); ok(Math.abs(bb.pos.y - .5) < .05, 'physics3d in browser');
  // Tone
  try { gs.sound.Tone(); } catch (x) { e = x; } ok(e?.kitLoading, 'Tone StillLoading'); await e.kitLoading; const T = gs.sound.Tone(); const syn = new T.Synth().toDestination(); syn.triggerAttackRelease('C4', '8n'); ok(!!T.Synth, 'Tone synth');
  // fx3d
  try { gs.fx3d.text3d('x'); } catch (x) { e = x; } ok(e?.kitLoading, 'fx3d StillLoading'); await e.kitLoading;
  const scene = new gs.THREE.Scene(); const t = gs.fx3d.text3d('HI', { size: .5 }); scene.add(t); ok(!!t.isMesh, 'text3d');
  const fx = new gs.fx3d.Particles3D(scene); fx.boom({ x: 0, y: 0, z: 0 }); fx.fire({ x: 0, y: 0, z: 0 }); fx.update(.016); fx.update(.016); ok(fx.live.size >= 3, 'particles3d ' + fx.live.size);
  const v = new gs.hd.HDView({}); gs.fx3d.outline(v, []); gs.fx3d.pixelate(v, 4); gs.fx3d.glitch(v); gs.fx3d.trails(v); ok(v.extras.length === 4, 'extra passes');
  const cc = document.createElement('canvas'); cc.width = 180; cc.height = 320; document.body.append(cc); const cx = cc.getContext('2d');
  v.render(cx, 180, 320); v.render(cx, 180, 320); ok(true, 'HDView render with extras');
  // round 3: game objects, scenes, pacing, aim, senses, camera, characters, nav3d, ragdoll
  const th = new gs.things.Things(); const pl = th.add({ x: 0, y: 0, r: 5 }, 'player'); th.add({ x: 3, y: 0, r: 2 }, 'coin'); ok(!!th.hit(pl, 'coin'), 'things');
  const sc = new gs.rounds.Scenes({ a: { update: (dt, s) => s.time > .1 && s.go('b') }, b: {} }, 'a'); for (let i = 0; i < 10; i++) sc.update(.05); ok(sc.name === 'b', 'scenes');
  const sp = new gs.pacing.Spawner({ every: .1 }); let n = 0; for (let i = 0; i < 30; i++) sp.update(.05, () => n++); ok(n > 10, 'spawner');
  const aa = new gs.aim.AimAssist({ autoFire: .05 }); let fire = false; for (let i = 0; i < 20; i++) fire ||= aa.update(.016, { x: 0, y: 0 }, .05, [{ x: 100, y: 0, r: 8 }]).fire; ok(fire, 'aim assist');
  const sn = new gs.senses.Senses({ spotTime: .2 }); for (let i = 0; i < 30; i++) sn.update(.05, { x: 0, y: 0, facing: 0 }, { x: 40, y: 0 }); ok(sn.mood === 'alert', 'senses');
  const v2 = new gs.hd.HDView({}); const hero = new gs.THREE.Object3D(); const rig = new gs.camera.CameraRig(v2, { mode: 'shoulder' }); rig.update(.016, hero); v2.render(cx, 180, 320); ok(v2.cam.position.z < 0, 'camera rig');
  const head = new gs.THREE.Object3D(); new gs.THREE.Group().add(head); gs.characters.lookAt(head, new gs.THREE.Vector3(1, 0, 0), null); ok(head.quaternion.y !== 0, 'look at');
  try { new gs.nav3d.NavMesh3D([]); } catch (x) { e = x; } ok(e?.kitLoading, 'nav3d StillLoading'); await e.kitLoading;
  const fl = new gs.THREE.Mesh(new gs.THREE.BoxGeometry(10, .2, 10)); fl.position.y = -.1;
  const nav = new gs.nav3d.NavMesh3D([fl]); ok(nav.path({ x: -3, y: 0, z: 0 }, { x: 3, y: 0, z: 0 }).length >= 2, 'nav3d path in browser');
  const sc3 = new gs.THREE.Scene(), guy = new gs.THREE.Group(); guy.position.y = 1; sc3.add(guy); guy.add(new gs.THREE.Mesh(new gs.THREE.BoxGeometry(.3, .5, .2)));
  const arm = new gs.THREE.Group(); arm.position.set(.2, .2, 0); arm.add(new gs.THREE.Mesh(new gs.THREE.BoxGeometry(.1, .4, .1).translate(0, -.2, 0))); guy.add(arm);
  const w4 = new gs.physics3d.World3D(); w4.floor(0); const rag = w4.ragdoll(guy); for (let i = 0; i < 60; i++) w4.step(1 / 60); ok(rag.parts.length === 2 && guy.position.y < .9, 'ragdoll');
  // vision library loads (no camera here)
  try { new gs.vision.Face(); } catch (x) { e = x; } ok(e?.kitLoading, 'vision StillLoading'); await e.kitLoading; const f = new gs.vision.Face(); const task = await f.makeTask(); ok(!!task, 'face model loads');
  const hands = new gs.vision.Hands(); ok(!!(await hands.makeTask()), 'hand model loads');
  // ai, math, moves, pad
  const crowd = new gs.ai.Crowd(); crowd.add(0, 0).chase({ x: 50, y: 50 }); crowd.update(.1); ok(true, 'ai');
  const m = new gs.moves.Moves(); m.update(); m.stop(); ok(true, 'moves'); ok(gs.pad.pad() === null, 'no pad');
  ok(!('store' in gs.util) && !('setSound' in gs.sound) && !('hapticSettings' in gs.device) && !('stopVision' in gs.vision), 'hidden stay hidden');
  ok(Object.isFrozen(gs) && Object.isFrozen(gs.sound), 'frozen');
  // Next Gen: reflections on marked surfaces (ultra), contact shadows, path-traced photo
  {
    const T3 = gs.THREE, hv = new gs.hd.HDView({ bg: '#334' }); gs.hd.HD.force = 3;
    const floor = new T3.Mesh(new T3.PlaneGeometry(10, 10).rotateX(-Math.PI / 2), gs.hd.pbr('#556', { rough: .1 })); hv.scene.add(floor);
    const cube = new T3.Mesh(new T3.BoxGeometry(1, 1, 1), gs.hd.pbr('#e44')); cube.position.y = .6; cube.castShadow = true; hv.scene.add(cube);
    hv.cam.position.set(0, 2, 4); hv.cam.lookAt(0, .5, 0); hv.reflect(floor);
    const cs = hv.contact({ y: 0, size: 4 });
    const hc = document.createElement('canvas'); hc.width = 160; hc.height = 120; document.body.append(hc); const hx = hc.getContext('2d');
    const direct = gs.hd.HD.direct; gs.hd.HD.direct = false;
    hv.render(hx, 160, 120); hv.render(hx, 160, 120);
    ok(hx.getImageData(80, 60, 1, 1).data[3] > 0, 'reflections + contact shadows render');
    ok(!!cs.rt && cs.plane.visible, 'contact shadow map made');
    const shot = await hv.photo({ samples: 2 }); const t0 = performance.now(); while (!shot.done && performance.now() - t0 < 180000) { shot.step(50); await new Promise(r => setTimeout(r, 10)); }
    ok(shot.done && shot.image().width > 0, 'path-traced photo: ' + shot.samples + ' samples in ' + Math.round(performance.now() - t0) + ' ms (software GPU)');
    shot.stop(); hv.render(hx, 160, 120); ok(!hv.shot, 'back to normal rendering after the photo');
    gs.hd.HD.direct = direct; gs.hd.HD.force = null;
    ok(!('currentView' in gs.hd), 'currentView hidden from games');
  }
  // 2D look: lights cut by walls, screen effects and fast sprites (PixiJS)
  {
    const lc = document.createElement('canvas'); lc.width = 200; lc.height = 100; const lx = lc.getContext('2d');
    lx.fillStyle = '#fff'; lx.fillRect(0, 0, 200, 100);
    new gs.look2d.Lights(200, 100, { dark: 1 }).draw(lx, [{ x: 30, y: 50, r: 80 }], { walls: [[60, 0, 60, 100]] });
    const px = (x, y) => lx.getImageData(x, y, 1, 1).data[0];
    ok(px(40, 50) > 150 && px(100, 50) < 20, 'light lit near, wall casts shadow: ' + px(40, 50) + ' / ' + px(100, 50));
    let le; try { new gs.look2d.Screen({ crt: true }); } catch (x) { le = x; } ok(le?.kitLoading, 'Screen waits for PixiJS'); await le.kitLoading;
    lx.fillStyle = '#f00'; lx.fillRect(0, 0, 200, 100);
    const scr = new gs.look2d.Screen({ grade: { red: 0, green: 1, blue: 1 } }); scr.apply(lx);
    ok(px(100, 50) < 40, 'screen effect ran (red graded out): ' + px(100, 50));
    scr.set({ grade: null, crt: true, bloom: true, glitch: true, film: true }); scr.shock(100, 50); scr.apply(lx); ok(true, 'crt, bloom, glitch, film, shockwave');
    const bc = document.createElement('canvas'); bc.width = 100; bc.height = 100; const bx = bc.getContext('2d');
    const batch = new gs.look2d.Batch(100, 100), tex = batch.texture(g => { g.fillStyle = '#0f0'; g.fillRect(0, 0, 8, 8); }, 8, 8);
    for (let i = 0; i < 2000; i++) batch.add(tex, Math.random() * 100, Math.random() * 100);
    batch.add(tex, 50, 50, { scale: 2 }); batch.draw(bx);
    ok(bx.getImageData(50, 50, 1, 1).data[1] > 200 && batch.count === 2001, 'batch drew 2001 sprites');
  }
} catch (err) { out.push('FAIL threw ' + (err && err.stack || err)); }
window.result = out;
</script>
