    const ga = new T.Group(), gb = new T.Group(), gc = new T.Group(); const areas = new Areas().add('a', ga, { min: { x: 0, y: 0, z: 0 }, max: { x: 10, y: 5, z: 10 } }).add('b', gb, { min: { x: 10, y: 0, z: 0 }, max: { x: 20, y: 5, z: 10 } }).add('c', gc, { min: { x: 20, y: 0, z: 0 }, max: { x: 30, y: 5, z: 10 } }).link('a', 'b').link('b', 'c');
    areas.update({ x: 5, y: 1, z: 5 }); ok(ga.visible && gb.visible && !gc.visible, 'areas hide rooms you cannot see');
    let made = 0; const ch = new Chunks(sc, { size: 10, radius: 1, perFrame: 9, make: () => { made++; return new T.Group(); } }); ch.update({ x: 0, y: 0, z: 0 }); ok(ch.count === 9, 'chunks built round the player');
    ch.update({ x: 100, y: 0, z: 0 }); ok(ch.count === 9 && made === 18, 'far chunks dropped, new ones built');

    const ears = new gs.sound.Ears(); ears.place({ x: 0, y: 0, z: 0 }); ears.tone(440, { x: 5, y: 0, z: 0 }); ears.noise(.2, { x: -5, y: 0, z: 0 }); ears.play('boom', { x: 0, y: 0, z: -10 });
    const eng = ears.loop({ x: 2, y: 0, z: 0 }); eng.move({ x: 3, y: 0, z: 0 }).pitch(120); eng.stop(); ok(ears.heard({ x: 2, y: 0, z: 0 }) > ears.heard({ x: 30, y: 0, z: 0 }), '3D sounds play and fall off with distance');
    const tune = gs.sound.music({ tempo: 140, lead: 'C5 E5 G5 E5', drums: 'k h s h', lead2: 'C6 . G5 .', layers: { drums: .3, lead2: .7 } }).start();
    tune.intensity(.5); ok(tune.level === .5, 'music intensity brings in layers'); tune.stop();
  }
} catch (err) { out.push('FAIL threw ' + (err && err.stack || err)); }
window.result = out;
</script>
