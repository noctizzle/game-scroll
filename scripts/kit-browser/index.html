      for (const z of [-8, -30, -120]) { const post = new T3.Mesh(new T3.BoxGeometry(1, 4, 1), gs.hd.pbr('#a55')); post.position.set(1, 2, z); post.castShadow = true; cv.scene.add(post); }
      cv.air({ haze: .001 });
      const sky = new Sky(cv, { time: 17.5, physical: true, clouds: .4, env: true, stars: 0 }); sky.update(.1);
      ok(sky.sunCol.b < sky.sunCol.r && sky.top.b > sky.top.r, `physical sky: orange evening sun (${sky.sunCol.getHexString()}), blue overhead (${sky.top.getHexString()})`);
      sl.fit(cv, { far: 300, near: 25, ground: () => 0 });
      ok(cv.cascade && sl.nearLight.parent && sl.nearLight.shadow.camera.right < sl.shadow.camera.right, `near cascade is the sharper one: ${(sl.nearLight.shadow.camera.right * 2).toFixed(0)} m vs ${(sl.shadow.camera.right * 2).toFixed(0)} m`);
      cv.focus = { at: 30, range: 3, depth: .5, blur: 8 };
      let bad = ''; const rr = gs.hd.bakeRenderer(); rr.debug.onShaderError = (g, p, vs, fs) => { bad = g.getShaderInfoLog(fs) || g.getShaderInfoLog(vs) || 'link'; };
      HDh.force = 3; cv.render(cx, 160, 120); cv.render(cx, 160, 120); rr.debug.onShaderError = null;
      ok(!bad && cx.getImageData(80, 90, 1, 1).data[3] > 0, 'renders with cascades, depth of field and the physical sky' + (bad ? ': ' + bad.slice(0, 300) : ''));
      HDh.force = 0; sl.setTier(gs.hd.TIERS[1]); sl.fit(cv, { far: 300, near: 25, ground: () => 0 }); cv.render(cx, 160, 120); HDh.force = null;
      ok(!cv.cascade && !sl.nearLight.visible, 'no cascade on the lower tiers');
      cv.focus = null; sky.dispose();
    }
    const rain = new Weather(hv, { kind: 'storm', amount: .5 }); let flashes = 0; rain.onFlash = () => flashes++; for (let i = 0; i < 60 * 15; i++) rain.update(1 / 60);
    ok(flashes >= 1 && rain.rainMesh.visible, 'storm rains and flashes: ' + flashes); rain.set('snow', 1); rain.update(.1); ok(rain.snowMesh.visible && !rain.rainMesh.visible, 'snow');
    const w6 = new gs.physics3d.World3D(); w6.floor(0); const car = w6.vehicle(null, { at: { x: 0, y: 1, z: 0 } });
    for (let i = 0; i < 60; i++) w6.step(1 / 60); ok(car.grounded, 'car settles on its wheels');
    for (let i = 0; i < 120; i++) { car.drive(1, 0); w6.step(1 / 60); } ok(car.speed > 2 && car.chassis.pos.z < -1, 'car drives forward: speed ' + car.speed.toFixed(1) + ' z ' + car.chassis.pos.z.toFixed(1));
    const h0 = car.chassis.body.rotation(); for (let i = 0; i < 60; i++) { car.drive(1, 1); w6.step(1 / 60); } const h1 = car.chassis.body.rotation(); ok(Math.abs(h1.y - h0.y) > .02 && !car.upsideDown, 'car steers and stays upright');
  }
  // round 7: poses, breaking things, a ball arena, big levels, 3D sound and music layers
  {
    const T = gs.THREE, { figure, Rig } = gs.poses;
    const man = figure({ body: '#c33' }); ok(man.rig && man.children.length > 0, 'a posable figure');
    man.rig.play('run'); for (let i = 0; i < 30; i++) man.rig.update(1 / 60, { speed: 5 }); ok(man.rig.state === 'run', 'figure runs');
    const w7 = new gs.physics3d.World3D(); w7.floor(0);
    const scene = new T.Scene(), wall = new T.Mesh(new T.BoxGeometry(4, 3, .4), new T.MeshStandardMaterial()); wall.position.set(0, 1.5, 0); scene.add(wall);
    const t0 = performance.now(), pieces = gs.destruction.shatter(wall, { pieces: 12, at: { x: 0, y: 1.5, z: .2 }, world: w7, push: 5, seed: 3 }), ms = performance.now() - t0;
    ok(pieces.length >= 8 && !wall.parent && pieces.every(p => p.parent === scene), `wall shattered into ${pieces.length} pieces in ${ms.toFixed(0)} ms`);
    const withBody = pieces.filter(p => p.body).length; for (let i = 0; i < 60; i++) w7.step(1 / 60);
    ok(withBody >= pieces.length / 2 && pieces.some(p => Math.abs(p.position.z) > .5), `pieces fly with physics (${withBody} bodies)`);
    const rub = new gs.destruction.Rubble(scene, { life: .2, shrink: .1 }); rub.add(pieces); for (let i = 0; i < 30; i++) rub.update(1 / 60); ok(rub.count === 0 && !pieces[0].parent, 'rubble tidies itself away');
    const log = new T.Mesh(new T.BoxGeometry(1, 1, 4), new T.MeshStandardMaterial()); scene.add(log);
    const halves = gs.destruction.slice(log, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 1 }); ok(halves.length === 2, 'slice cuts in two');

    const { Arena, BallCar, chaseBall } = gs.arena, w8 = new gs.physics3d.World3D();
    const ar = new Arena(w8, { w: 30, l: 44, time: 60 }); let goals = 0; ar.on('goal', () => goals++);
    const me = new BallCar(w8, null, { team: 0 }), bot = new BallCar(w8, null, { team: 1 }); ar.cars.push(me, bot); ar.kickoff();
    for (let i = 0; i < 60; i++) { me.update(1 / 60); bot.update(1 / 60); w8.step(1 / 60); ar.update(1 / 60); }
    ok(me.grounded && Math.abs(me.pos.z - ar.spawns[0][0].z) < 1, 'ball cars sit on their spawns');
    for (let i = 0; i < 90; i++) { me.control({ throttle: 1, boost: true }).update(1 / 60); w8.step(1 / 60); ar.update(1 / 60); }
    ok(me.pos.z > ar.spawns[0][0].z + 5 && me.boost < 33, 'boost drives toward the other goal: z ' + me.pos.z.toFixed(1) + ' boost ' + me.boost.toFixed(0));
    me.control({ jump: true }).update(1 / 60); for (let i = 0; i < 20; i++) { me.control({ jump: true }).update(1 / 60); w8.step(1 / 60); } ok(!me.grounded && me.pos.y > 1, 'jumps');
    ok(ar.frames.length > 0 && ar.playback(0).length === 3, 'replay frames kept');
    me.spawn({ x: -12, y: .6, z: 0 }); bot.spawn({ x: 12, y: .6, z: 0 }); ar.ball.place({ x: 0, y: 1.2, z: 18 }); ar.ball.setVel(0, 0, 25); for (let i = 0; i < 60; i++) { w8.step(1 / 60); ar.update(1 / 60); }
    ok(goals === 1 && ar.score[0] === 1, 'a goal counts: ' + ar.score.join('-'));
    ar.kickoff(); ar.ball.setVel(0, 10, 4); const path = ar.predict(2); ok(path.length > 30 && path.some(p => p.bounce), 'ball path predicted with bounces');
    const inp = chaseBall(bot, ar); ok(typeof inp.throttle === 'number' && typeof inp.steer === 'number', 'the simple opponent drives');
    ar.ball.place({ x: 14, y: 1.5, z: 0 }); ar.ball.setVel(8, 0, 0); for (let i = 0; i < 40; i++) { w8.step(1 / 60); ar.update(1 / 60); } ok(Math.abs(ar.ball.pos.x) < 15.5, 'the curved walls keep the ball in');

    const { Props, Areas, Chunks, simplify } = gs.props, sc = new T.Scene();
    const geo = new T.IcosahedronGeometry(1, 3), low = simplify(geo, .2); ok(low.attributes.position.count < geo.attributes.position.count, 'simplify makes a lighter shape');
    const pr = new Props(sc); pr.kind('rock', geo, new T.MeshStandardMaterial(), { lod: [20, 50] });
    const ids = pr.scatter('rock', 500, { x0: -100, z0: -100, x1: 100, z1: 100 }, { gap: 2, seed: 4 }); pr.done();
    ok(ids.length === 500 && pr.count('rock') === 500, 'scattered 500 props'); ok(pr.near('rock', { x: 0, y: 0, z: 0 }, 15).length > 0, 'finds nearby props');
    const rr = new T.WebGLRenderer({ canvas: document.createElement('canvas') }), cam = new T.PerspectiveCamera(60, 1, .1, 300); cam.position.set(0, 20, 60); cam.lookAt(0, 0, 0); sc.add(new T.DirectionalLight()); const f0 = performance.now(); for (let i = 0; i < 5; i++) rr.render(sc, cam); ok(true, 'drew 500 props x5 in ' + (performance.now() - f0).toFixed(0) + ' ms');
    const ga = new T.Group(), gb = new T.Group(), gc = new T.Group(); const areas = new Areas().add('a', ga, { min: { x: 0, y: 0, z: 0 }, max: { x: 10, y: 5, z: 10 } }).add('b', gb, { min: { x: 10, y: 0, z: 0 }, max: { x: 20, y: 5, z: 10 } }).add('c', gc, { min: { x: 20, y: 0, z: 0 }, max: { x: 30, y: 5, z: 10 } }).link('a', 'b').link('b', 'c');
    areas.update({ x: 5, y: 1, z: 5 }); ok(ga.visible && gb.visible && !gc.visible, 'areas hide rooms you cannot see');
    let made = 0; const ch = new Chunks(sc, { size: 10, radius: 1, perFrame: 9, make: () => { made++; return new T.Group(); } }); ch.update({ x: 0, y: 0, z: 0 }); ok(ch.count === 9, 'chunks built round the player');
    ch.update({ x: 100, y: 0, z: 0 }); ok(ch.count === 9 && made === 18, 'far chunks dropped, new ones built');

    const ears = new gs.sound.Ears(); ears.place({ x: 0, y: 0, z: 0 }); ears.tone(440, { x: 5, y: 0, z: 0 }); ears.noise(.2, { x: -5, y: 0, z: 0 }); ears.play('boom', { x: 0, y: 0, z: -10 });
    const eng = ears.loop({ x: 2, y: 0, z: 0 }); eng.move({ x: 3, y: 0, z: 0 }).pitch(120); eng.stop(); ok(ears.heard({ x: 2, y: 0, z: 0 }) > ears.heard({ x: 30, y: 0, z: 0 }), '3D sounds play and fall off with distance');
    const sp = gs.sound.space({ seconds: 1, wet: .3 }); gs.sound.noise(.15, { out: sp?.in, attack: .01 }); sp?.set({ wet: .1, bright: 2000 });
    const ears2 = new gs.sound.Ears({ space: sp, send: .4 }); ears2.place({ x: 0, y: 0, z: 0 }); ears2.play('boom', { x: 0, y: 0, z: -20 });
    const bd = gs.sound.bed({ vol: .01, from: 500, gusts: .5 }); bd.set({ vol: .005, from: 900 }, .2); bd.stop(); ok(typeof bd.set === 'function', 'space reverb, Ears into a space, beds glide and stop');
    const tune = gs.sound.music({ tempo: 140, lead: 'C5 E5 G5 E5', drums: 'k h s h', lead2: 'C6 . G5 .', layers: { drums: .3, lead2: .7 } }).start();
    tune.intensity(.5); ok(tune.level === .5, 'music intensity brings in layers'); tune.stop();
  }
  // round 8: outdoor worlds, floating, real dice, words, look-free UI
  {
    let gpl; try { gs.craft; } catch (x) { gpl = x; } ok(gpl?.kitLoading, 'gs.craft StillLoading (play kits load on first use)'); await gpl.kitLoading; ok(!!gs.cards.Deck && !!gs.soft.Soft && !!gs.ui.UI, 'play kits in');
    const T = gs.THREE, { Land, Water, tree, rock } = gs.outdoors;
    const land = new Land({ kind: 'islands', size: 120, segments: 48, seed: 5 }).paint([[-5, '#235'], [0, '#dc9'], [3, '#4a3'], [14, '#fff']]);
    ok(Number.isFinite(land.height(10, -20)) && land.mesh.geometry.attributes.color, 'land with height colours');
    land.flatten(0, 0, 8, 2); ok(Math.abs(land.height(0, 0) - 2) < .01, 'a flattened pad');
    const sc = new T.Scene(); sc.add(land.object); const grass = land.grass({ count: 800, above: 0, seed: 1 }); ok(!!grass, 'grass scattered');
    const cam = new T.PerspectiveCamera(60, 1, .1, 300); cam.position.set(0, 20, 40); land.update(1 / 60, cam);
    const tr = tree({ kind: 'pine' }), rk = rock({ seed: 3 }); ok(tr.attributes.position.count > 50 && rk.attributes.position.count > 20, 'trees and rocks');
    const water = new Water({ level: 0, waves: 1 }); sc.add(water.mesh); water.update(.5, { x: 0, y: 0, z: 0 }); ok(Math.abs(water.height(3, 4)) < 1, 'waves');
    const rr = new T.WebGLRenderer({ canvas: document.createElement('canvas') }); rr.setSize(256, 256); sc.add(new T.DirectionalLight()); rr.render(sc, cam); ok(true, 'outdoor scene renders');
    { // the outdoor looks: ground with masks, far hills, rock and leaves all compile and draw
      const { looks, groundDetail, horizon } = gs.outdoors, gd = groundDetail(), gm = new T.MeshStandardMaterial({ normalMap: gd.normal });
      const gl = looks.ground(gm, { detail: gd.detail, roads: [[-20, 0, 20, 5]] }); gl.wet = .5;
      const l2 = new Land({ kind: (x, z) => Math.sin(x * .1) * 3, size: 80, segments: 32, material: gm }).masks((x, z, y, sl) => [x > 0 ? 1 : 0, z > 20 ? 1 : 0, sl, 0]);
      const rm = new T.MeshStandardMaterial({ vertexColors: true }); looks.rock(rm, { mossy: .5 });
      const lm = new T.MeshStandardMaterial({ map: gd.detail, alphaTest: .5, side: T.DoubleSide }); const lu = looks.leaves(lm, { wind: .8 }); lu.uniforms.lkTime.value = 2;
      const s2 = new T.Scene(); s2.add(l2.object, horizon(l2, { inner: 38, outer: 160, height: 60 }), new T.Mesh(rock({ seed: 2 }), rm), new T.Mesh(new T.PlaneGeometry(2, 2), lm), new T.DirectionalLight());
      let bad = ''; rr.debug.onShaderError = (g, p, vs, fs) => { bad = g.getShaderInfoLog(fs) || g.getShaderInfoLog(vs) || 'link'; };
      rr.render(s2, cam); rr.debug.onShaderError = null;
      ok(!bad && gm.userData.gsLooks.join() === 'ground' && lm.userData.gsLooks.join() === 'leaves' && l2.mesh.geometry.attributes.gsMask, 'outdoor looks compile and draw' + (bad ? ': ' + bad.slice(0, 200) : ''));
    }
    { // one wind: gusts, leaves, grass, particles; far trees as baked impostor cards
      const { Wind, impostor, looks } = gs.outdoors, w = new Wind({ x: 4, z: 0, gust: .5 }); w.update(1);
      const g1 = w.at(0, 0).speed, g2 = w.at(37, 11).speed; ok(g1 > 0 && Math.abs(g1 - g2) > 1e-3 && w.uniforms.lkWindDir.value.x === 1, `wind with gusts: ${g1.toFixed(2)} / ${g2.toFixed(2)} m/s`);
      land.wind = w; land.update(1 / 60, cam); ok(true, 'grass follows the wind');
      const lm = new T.MeshStandardMaterial({ alphaTest: .5 }), lu = looks.leaves(lm, { wind: w }); ok(lu.uniforms.lkWindDir === w.uniforms.lkWindDir, 'leaves share the wind');
      const hv2 = new gs.hd.HDView({}), pt = new gs.hd.Particles(hv2, { wind: w, additive: false }); pt.emit({ x: 0, y: 1, z: 0, life: 2 }); for (let i = 0; i < 30; i++) pt.update(1 / 30); ok(pt.list[0].x > .5, 'smoke drifts downwind: ' + pt.list[0].x.toFixed(2));
      const tg = tree({ kind: 'round', height: 6 }), imp = impostor(tg, new T.MeshStandardMaterial({ vertexColors: true }), { cards: 3, size: 64 });
      const px = new Uint8Array(4), mid = new Uint8Array(4), r3 = gs.hd.bakeRenderer(); r3.readRenderTargetPixels(imp.target, 0, 63, 1, 1, px); r3.readRenderTargetPixels(imp.target, 96, 32, 1, 1, mid);
      ok(imp && imp.geometry.attributes.position.count === 12 && imp.target.width === 192 && mid[3] > 200 && px[3] === 0, `tree impostor: 3 cards on a 192 x 64 picture (tree ${mid[3]}, corner ${px[3]})`);
      imp.dispose();
    }
    const w9 = new gs.physics3d.World3D(); land.solid(w9); const b9 = w9.ball(null, .5, { at: { x: 0, y: 8, z: 0 } }); for (let i = 0; i < 120; i++) w9.step(1 / 60);
    ok(Math.abs(b9.pos.y - (land.height(b9.pos.x, b9.pos.z) + .5)) < .3, 'land is solid in physics3d: ' + b9.pos.y.toFixed(2));
    const wf = new gs.physics3d.World3D(); const crate = wf.box(null, 1, 1, 1, { at: { x: 0, y: 3, z: 0 }, density: .5 }); const fl = new gs.craft.Floater(crate, water);
    for (let i = 0; i < 300; i++) { water.update(1 / 60); fl.update(1 / 60); wf.step(1 / 60); } ok(Math.abs(crate.pos.y - water.height(crate.pos.x, crate.pos.z)) < 1, 'a crate floats: ' + crate.pos.y.toFixed(2));
    const wd = new gs.physics3d.World3D(); wd.floor(0); const dice = new gs.dice.Dice3D(wd, 2, { seed: 4 }); let got = null; dice.on('settle', v => { got = v; }); dice.throw();
    for (let i = 0; i < 600 && !dice.settled; i++) { wd.step(1 / 60); dice.update(1 / 60); } ok(got && got.every(v => v >= 1 && v <= 6), '3D dice settle on ' + got);

    let we; try { new gs.words.Words(); } catch (x) { we = x; } ok(we?.kitLoading, 'Words StillLoading first'); await we.kitLoading;
    const dict = new gs.words.Words(); ok(dict.size > 40000 && dict.has('ocean') && dict.has('colour') && !dict.has('qzxv'), 'dictionary has ' + dict.size + ' words');
    const ans = dict.random({ length: 5, seed: 'day1' }); ok(ans.length === 5 && ans === dict.random({ length: 5, seed: 'day1' }), 'seeded word ' + ans);
    ok(dict.from('tsrleai', { min: 3 }).includes('stair'), 'words in letters'); ok(dict.anagrams('listen').includes('silent'), 'anagrams');
    ok(dict.match('c?t').includes('cat'), 'patterns'); const hits = dict.find(['cat', 'ore', 'pin']).map(f => f.word); ok(hits.includes('core') || hits.includes('rot'), 'grid words: ' + hits.slice(0, 5));
    ok(gs.words.compare('speed', 'abide').join() === 'miss,miss,near,miss,near' && gs.words.compare('robot', 'robot').every(x => x === 'hit'), 'compare counts letters fairly');

    let ue; try { new gs.ui.UI(100, 100, {}); } catch (x) { ue = x; } ok(ue?.kitLoading, 'UI StillLoading first'); await ue.kitLoading;
    const ui = new gs.ui.UI(360, 640, { dir: 'row', pad: 10, gap: 10, children: [{ id: 'a', grow: 1, tap: true }, { id: 'b', grow: 2, tap: true }] });
    ok(Math.abs(ui.node('b').box.w - 2 * ui.node('a').box.w) < 1, 'ui flex grow in the browser'); const cv = document.createElement('canvas').getContext('2d'); ok(gs.ui.wrap(cv, 'one two three four five six', 60).length > 1, 'text wraps'); ui.free();
  }
} catch (err) { out.push('FAIL threw ' + (err && err.stack || err)); }
{
  const { mixer, tone, say, talking } = gs.sound;
  mixer.room('hall').muffle(.6).volume('music', .4).duck('music', .2, .1); tone(440, { len: .05 }); tone(660, { len: .05, bus: 'alarm' });
  mixer.reset(); ok(typeof say === 'function' && talking() === false, 'mixer channels, room, muffle and duck run in a real browser');
}
window.result = out;
</script>
