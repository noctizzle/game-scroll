<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
// scripts/shader-hold.cjs: a new kind of thing appears mid-round. With v.holdNew (default) its shader is
// built in the background: the frame it appears in doesn't stop for it, and it shows a frame or two later.
// ?hold=0 builds it in the frame instead, for the comparison.
import gs, { loadParts } from '../../src/gamescroll.js';
import { setGpuPick, prepareGPU } from '../../src/kit/gpu.js';
const Q = new URLSearchParams(location.search), GPU = Q.has('gpu');
setGpuPick(GPU ? 'webgpu' : 'webgl');
await loadParts();
if (GPU && !await prepareGPU()) { window.result = { error: 'WebGPU did not start' }; throw new Error('no WebGPU'); }
const T = gs.THREE, HD = window.__hd, frame = () => new Promise(r => requestAnimationFrame(r));
HD.force = 2; HD.hold = Q.get('hold') !== '0';
const v = new gs.hd.HDView({ bg: '#9ab4d0', amb: .3 }), c = document.createElement('canvas'); c.width = 240; c.height = 320; document.body.append(c); const x = c.getContext('2d');
v.cam.position.set(0, 3, 8); v.cam.lookAt(0, 1, 0);
const sun = gs.hd.sun(); v.scene.add(sun, sun.target); v.sun = sun;
const ground = new T.Mesh(new T.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), gs.hd.pbr('#6a7a58', { rough: .9 })); ground.receiveShadow = true; v.scene.add(ground);
for (let i = 0; i < 6; i++) { v.render(x, 240, 320); await frame(); }
// something new mid-round: a material and geometry kind the view hasn't drawn
const m = new T.Mesh(new T.TorusKnotGeometry(.8, .25, 128, 24), new T.MeshPhysicalMaterial({ color: '#c44', clearcoat: 1, sheen: 1, iridescence: .8, transmission: .3, thickness: .5 }));
m.position.set(0, 1.5, 0); m.castShadow = true; v.scene.add(m);
const t0 = performance.now(); v.render(x, 240, 320); const first = performance.now() - t0;
const heldAtFirst = HD.info.held || 0;
let shownAfter = 0; const t1 = performance.now();
for (let i = 0; i < 400 && (HD.info.held || 0) > 0; i++) { await frame(); v.render(x, 240, 320); shownAfter++; }
const waitMs = performance.now() - t1;
const others = []; for (let i = 0; i < 5; i++) { await frame(); const t = performance.now(); v.render(x, 240, 320); others.push(performance.now() - t); }
window.result = { backend: HD.info.backend, first, heldAtFirst, shownAfter, waitMs, after: Math.max(...others), stillHeld: HD.info.held || 0 };
</script>
